# ProtSCAPE Inference Configuration
# Default config for atomic-level graph inference/testing

# Dataset/Model
protein: "6p5h"
graphs_pkl: "data/graphs/6p5h_A_graphs.pkl"
# ckpt_path: "train_logs/progsnn_logs_run_deshaw_2026-01-27-140711/model_FINAL_6h86.pt"  # Required - override this!
ckpt_path: "train_logs/progsnn_logs_run_atlas_2026-02-18-184924/model_FINAL_6p5h_GCN.pt"
# MDAnalysis export (must match how graphs were built)
pdb: "data/datasets/6p5h_A_protein/6p5h_A.pdb"
xtc: "data/datasets/6p5h_A_protein/6p5h_A_prod_R1_fit.xtc"
# DataLoader
batch_size: 1
num_workers: 2

# Model hparams (must match training)
latent_dim: 128
hidden_dim: 256
embedding_dim: 128
input_dim: 3
lr: 1e-3
alpha: 50.0
beta_loss: 0.5
coord_weight: 50.0
probs: 0.2
nhead: 1
layers: 3
task: "reg"

# Equivariant MP hparams
num_mp_layers: 2
mp_hidden: 256

# Normalization toggles
normalize_energy: true
normalize_xyz: false

# Evaluation + export
export_pdb: true
n_pdb_frames: 50
out_dir: "Ablations/6p5h/inference_test/"  # Directory to save outputs (PDBs, plots, etc.)

# Latent visualization
save_latents: true
plot_latents: true
phate_knn: 5
phate_t: 30
seed: 0

# Device
device: "cuda"

# ====================================
# ABLATION: Use GCN instead of Scattering
# ====================================
feature_extractor: "gcn"  # Options: "scattering" (default), "gcn", "simple_gcn"
gcn_num_layers: 4         # Number of GCN layers (matches scattering depth)
gcn_hidden_channels: null # null = same as input_dim

# Node features - keep all enabled for fair comparison
ablate_node_features:
  use_atomic_number: true
  use_residue_index: true
  use_amino_acid: true
  use_xyz: true
  randomize_atomic_number: false
  randomize_residue_index: false
  randomize_amino_acid: false
  randomize_xyz: false

# Edge features - keep enabled
ablate_edge_features:
  use_edge_features: true
  randomize_edge_features: false
  zero_edge_features: false